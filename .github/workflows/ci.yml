name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traderai
          POSTGRES_PASSWORD: traderai
          POSTGRES_DB: traderai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traderai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Testes (SQLite em memória)
        run: pytest
      - name: Testes (PostgreSQL, inclui migrations)
        run: pytest --cov=app --cov-report=term
        env:
          TEST_DATABASE_URL: postgresql+psycopg://traderai:traderai@localhost:5432/traderai_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
